#cloud-config
# =============================================================================
# Cloud-Init User Data for Proxmox VE Edge Node
# Installs Docker, hardens SSH, clones Quota Pay, and starts the compose profile
# =============================================================================
package_update: true
package_upgrade: false
ssh_pwauth: ${disable_password_auth ? "false" : "true"}
packages:
  - curl
  - git
  - ca-certificates

write_files:
  - path: /etc/ssh/sshd_config.d/99-quota-hardening.conf
    permissions: '0644'
    content: |
      PasswordAuthentication ${disable_password_auth ? "no" : "yes"}
      PermitRootLogin prohibit-password
      PubkeyAuthentication yes
  - path: /etc/systemd/system/quota-pay-compose.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Quota Pay Edge Container Orchestration
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/quota-pay
      ExecStart=/usr/bin/docker compose -f docker/${compose_target} up -d ${join(" ", services)}
      ExecStop=/usr/bin/docker compose -f docker/${compose_target} down

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl reload ssh || systemctl reload sshd || true
  # 1. Install Docker Engine
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - systemctl enable --now docker
  # 2. Setup workspace directory
  - mkdir -p /opt/quota-pay
  - cd /opt/quota-pay
  - git clone -b "${git_branch}" https://github.com/efekankati/quota-pay.git . || git clone https://github.com/efekankati/quota-pay.git . || git pull
  # 3. Enable and trigger compose launch
  - systemctl daemon-reload
  - systemctl enable --now quota-pay-compose.service
